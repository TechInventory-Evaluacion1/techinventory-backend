spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/ddfccc4f-6e03-4e1c-90b3-e5ba0d8a9523/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://0a8285a1-9a6e-4150-9ffc-57c1badf3bff

app.security.tenant-id=ddfccc4f-6e03-4e1c-90b3-e5ba0d8a9523
app.security.issuer-uri=https://login.microsoftonline.com/ddfccc4f-6e03-4e1c-90b3-e5ba0d8a9523/v2.0
app.security.audiences=api://0a8285a1-9a6e-4150-9ffc-57c1badf3bff,0a8285a1-9a6e-4150-9ffc-57c1badf3bff

# Configuración Conexión y Listener RabbitMQ (Confirmación Manual ACK - Intacta)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Configuración Centralizada de Mensajería RabbitMQ
app.rabbitmq.exchanges.direct=techinventory.direct.exchange
app.rabbitmq.exchanges.topic=techinventory.topic.exchange
app.rabbitmq.exchanges.dlx=techinventory.dlx.exchange
app.rabbitmq.queues.producto-crear=inventario.producto.crear.queue
app.rabbitmq.queues.producto-crear-dlq=inventario.producto.crear.dlq
app.rabbitmq.routing-keys.producto-crear=inventario.producto.creado
app.rabbitmq.routing-keys.producto-crear-dlq=inventario.producto.creado.dlq

# =========================================================================
# CONFIGURACIÓN APACHE KAFKA (Evaluación 3 - Consumidores y Consumer Groups)
# =========================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.techinventory.inventario.dto.KafkaStreamEvent

# Tópicos y Consumer Groups
app.kafka.topics.catalogo-eventos=techinventory.catalogo.eventos
app.kafka.topics.analitica-stock=techinventory.inventario.analitica
app.kafka.groups.catalogo=inventario-catalogo-group
app.kafka.groups.analitica=inventario-analitica-group