spring.application.name=inventario-service
server.port=${PORT:8082}

# URL para Docker local (Puerto 3307):
spring.datasource.url=jdbc:mysql://localhost:3307/techinventory?useSSL=false&allowPublicKeyRetrieval=true

# URL de AWS RDS (Comentada para que no se ejecute):
# spring.datasource.url=jdbc:mysql://inventory-db.cebcallyjsuv.us-east-1.rds.amazonaws.com:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/ddfccc4f-6e03-4e1c-90b3-e5ba0d8a9523/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://0a8285a1-9a6e-4150-9ffc-57c1badf3bff

app.security.tenant-id=ddfccc4f-6e03-4e1c-90b3-e5ba0d8a9523
app.security.issuer-uri=https://login.microsoftonline.com/ddfccc4f-6e03-4e1c-90b3-e5ba0d8a9523/v2.0
app.security.audiences=api://0a8285a1-9a6e-4150-9ffc-57c1badf3bff,0a8285a1-9a6e-4150-9ffc-57c1badf3bff

# Configuración Conexión y Listener RabbitMQ (Confirmación Manual ACK)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Configuración Centralizada de Mensajería RabbitMQ (Criterio 1 - 12%)
app.rabbitmq.exchanges.direct=techinventory.direct.exchange
app.rabbitmq.exchanges.topic=techinventory.topic.exchange
app.rabbitmq.exchanges.dlx=techinventory.dlx.exchange
app.rabbitmq.queues.producto-crear=inventario.producto.crear.queue
app.rabbitmq.queues.producto-crear-dlq=inventario.producto.crear.dlq
app.rabbitmq.routing-keys.producto-crear=inventario.producto.creado
app.rabbitmq.routing-keys.producto-crear-dlq=inventario.producto.creado.dlq