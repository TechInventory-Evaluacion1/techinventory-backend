version: '3.8'

services:
  rabbitmq1:
    image: rabbitmq:3.12-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: 'CLUSTERING_SECRET_COOKIE_123'
      RABBITMQ_DEFAULT_USER: 'admin'
      RABBITMQ_DEFAULT_PASS: 'admin123'
    ports:
      - "5672:5672"     # Puerto AMQP
      - "15672:15672"   # Consola Web RabbitMQ Management
    volumes:
      - rabbitmq1-data:/var/lib/rabbitmq

  rabbitmq2:
    image: rabbitmq:3.12-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: 'CLUSTERING_SECRET_COOKIE_123'
    depends_on:
      - rabbitmq1
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq2-data:/var/lib/rabbitmq

volumes:
  rabbitmq1-data:
  rabbitmq2-data: