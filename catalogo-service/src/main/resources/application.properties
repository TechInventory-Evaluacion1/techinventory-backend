spring.application.name=catalogo-service
server.port=${PORT:8081}

# URL para Docker local (Puerto 3307):
spring.datasource.url=jdbc:mysql://localhost:3307/techinventory?useSSL=false&allowPublicKeyRetrieval=true

# URL de AWS RDS (Comentada para que no se ejecute):
# spring.datasource.url=jdbc:mysql://inventory-db.cebcallyjsuv.us-east-1.rds.amazonaws.com:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never

# Configuración Conexión RabbitMQ (Intacta de Entrega 2)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Configuración Centralizada de Mensajería RabbitMQ
app.rabbitmq.exchanges.direct=techinventory.direct.exchange
app.rabbitmq.exchanges.topic=techinventory.topic.exchange
app.rabbitmq.exchanges.dlx=techinventory.dlx.exchange
app.rabbitmq.queues.producto-crear=inventario.producto.crear.queue
app.rabbitmq.queues.producto-crear-dlq=inventario.producto.crear.dlq
app.rabbitmq.routing-keys.producto-crear=inventario.producto.creado
app.rabbitmq.routing-keys.producto-crear-dlq=inventario.producto.creado.dlq

# =========================================================================
# CONFIGURACIÓN APACHE KAFKA (Evaluación 3 - Streaming y Analítica)
# =========================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Tópico 1: Eventos de Catálogo (Streaming de creación y reservas)
app.kafka.topics.catalogo-eventos.name=techinventory.catalogo.eventos
app.kafka.topics.catalogo-eventos.partitions=3
app.kafka.topics.catalogo-eventos.replicas=1
app.kafka.topics.catalogo-eventos.retention-ms=604800000
app.kafka.topics.catalogo-eventos.cleanup-policy=delete

# Tópico 2: Analítica y Telemetría de Stock (Auditoria y métricas)
app.kafka.topics.analitica-stock.name=techinventory.inventario.analitica
app.kafka.topics.analitica-stock.partitions=2
app.kafka.topics.analitica-stock.replicas=1
app.kafka.topics.analitica-stock.retention-ms=2592000000
app.kafka.topics.analitica-stock.cleanup-policy=compact,delete