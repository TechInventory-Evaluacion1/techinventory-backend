spring.application.name=catalogo-service
server.port=8081

spring.datasource.url=jdbc:h2:mem:catalogo;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.auto-startup=false

app.rabbitmq.exchanges.direct=techinventory.direct.exchange
app.rabbitmq.exchanges.topic=techinventory.topic.exchange
app.rabbitmq.exchanges.dlx=techinventory.dlx.exchange
app.rabbitmq.queues.producto-crear=inventario.producto.crear.queue
app.rabbitmq.queues.producto-crear-dlq=inventario.producto.crear.dlq
app.rabbitmq.routing-keys.producto-crear=inventario.producto.creado
app.rabbitmq.routing-keys.producto-crear-dlq=inventario.producto.creado.dlq
